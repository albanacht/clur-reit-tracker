<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CLUR - Cluaran Capital Small-Cap REIT Factor Portfolio</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f7f8fa;margin:0;padding:24px;color:#1a1a1a}.wrap{max-width:1040px;margin:0 auto}h1{color:#1f3864;font-size:25px;margin:0 0 4px}.sub{color:#595959;font-size:13.5px}.note{background:#eef3fa;border:1px solid #cfdcee;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#28405e;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:20px 0}.card{background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:15px}.lbl{font-size:11.5px;color:#595959;text-transform:uppercase}.val{font-size:22px;font-weight:700;color:#1f3864;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #e3e6ea}th{color:#595959;font-size:11.5px;text-transform:uppercase}.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#edf1f8;color:#1f3864;font-weight:600}footer{color:#595959;font-size:11.5px;margin-top:28px;text-align:center}</style></head><body><div class="wrap"><h1 id="fname">CLUR</h1><div class="sub" id="fsub">Loading...</div><div class="note">Self-managed model portfolio tracked for research purposes. Not a listed security, not offered for sale, and not investment advice.</div><div class="grid" id="stats"></div><div class="card"><h3 style="color:#1f3864;margin-top:0;font-size:16px">Holdings</h3><table><thead><tr><th>Ticker</th><th>Sector</th><th>Weight</th><th>Price</th><th>Value</th></tr></thead><tbody id="tbody"></tbody></table></div><footer>Equal-weight, 8 holdings. Deep review May and November.</footer></div><script>fetch('data.json?_='+Date.now()).then(function(r){return r.json()}).then(function(d){document.getElementById('fname').textContent=d.ticker+' - '+d.fund_name;document.getElementById('fsub').textContent='Inception '+d.inception_date+' | $'+d.inception_capital.toLocaleString()+' | vs '+d.benchmark_primary+' and '+d.benchmark_secondary+' | as of '+d.as_of;var s=[['NAV','$'+d.current_nav.toLocaleString()],['Return since inception',d.fund_return_pct.toFixed(2)+'%'],['vs '+d.benchmark_primary,(d.fund_return_pct-d.primary_return_pct).toFixed(2)+'%'],['vs '+d.benchmark_secondary,(d.fund_return_pct-d.secondary_return_pct).toFixed(2)+'%'],['Dividends','$'+d.dividends_cumulative.toFixed(2)],['Cash','$'+d.cash.toFixed(2)]];document.getElementById('stats').innerHTML=s.map(function(x){return '<div class="card"><div class="lbl">'+x[0]+'</div><div class="val">'+x[1]+'</div></div>'}).join('');document.getElementById('tbody').innerHTML=d.holdings.map(function(h){return '<tr><td><strong>'+h.ticker+'</strong><br><span style="color:#595959;font-size:11.5px">'+h.name+'</span></td><td><span class="pill">'+h.sector+'</span></td><td>'+h.weight_pct+'%</td><td>$'+h.price.toFixed(2)+'</td><td>$'+h.value.toFixed(2)+'</td></tr>'}).join('')});</script></body></html>
